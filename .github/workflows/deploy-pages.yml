name: Publish Castle of the Last Warden

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
      - .nojekyll
      - assets/**
      - pages-publish-trigger.txt
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages static game
        run: npm run build:pages

      - name: Verify deployable entry point
        run: |
          test -f dist-pages/index.html
          test -d dist-pages/assets
          touch dist-pages/.nojekyll
          echo "Static game entry verified: dist-pages/index.html"

      - name: Publish compiled game into main root
        run: |
          rm -rf assets
          cp dist-pages/index.html ./index.html
          cp -R dist-pages/assets ./assets
          cp dist-pages/.nojekyll ./.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "Compiled Pages bundle already current."
          else
            git commit -m "Publish playable GitHub Pages bundle"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
